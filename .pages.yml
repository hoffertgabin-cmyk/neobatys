# Configuration de Pages CMS (https://app.pagescms.org) : l'interface qui permet
# de modifier les textes du site sans toucher au code. Chaque bloc ci-dessous
# correspond à un fichier de content/data/. Mode d'emploi : EDITION.md.


media:
  input: public/images
  output: /images
  extensions:
  - png
  - jpg
  - jpeg
  - webp
  - svg
content:
- name: site
  label: Infos de l'entreprise
  type: file
  path: content/data/site.json
  format: json
  fields:
  - name: site
    label: Entreprise
    type: object
    fields:
    - name: name
      label: Nom
      type: string
    - name: tagline
      label: Slogan
      type: string
    - name: phone
      label: Téléphone (affiché)
      type: string
      description: Ex. 06 12 34 56 78. Vide ou entre crochets = masqué sur le site.
    - name: phoneHref
      label: Téléphone (format international)
      type: string
      description: Ex. +33612345678. Tant que le téléphone est vide ou entre crochets, le numéro et les boutons « Appeler » sont masqués.
    - name: email
      label: E-mail
      type: string
    - name: address
      label: Adresse du siège
      type: object
      fields:
      - name: street
        label: Rue
        type: string
      - name: postalCode
        label: Code postal
        type: string
      - name: city
        label: Ville
        type: string
      - name: country
        label: Pays (code)
        type: string
        readonly: true
    - name: hours
      label: Horaires
      type: string
    - name: socials
      label: Réseaux sociaux
      description: Laisser vide pour masquer l'icône.
      type: object
      fields:
      - name: facebook
        label: Facebook
        type: string
      - name: instagram
        label: Instagram
        type: string
      - name: linkedin
        label: LinkedIn
        type: string
    - name: showSampleContent
      label: Afficher les contenus d'exemple
      description: "Décoché : les avis, chiffres et projets marqués « Exemple » sont masqués (les maquettes restent visibles, présentées comme des exemples). Coché : ils s'affichent avec un badge « Exemple ». À laisser décoché sur le site en ligne."
      type: boolean
- name: home
