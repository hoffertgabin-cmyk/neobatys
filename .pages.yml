        label: Fond sombre
        type: string
      - name: soft
        label: Fond clair
        type: string
      - name: accent
        label: Appoint
        type: string
      - name: ink
        label: Petits textes sur fond clair (facultatif)
        type: string
    - name: placeholder
      label: Maquette d'exemple (projet fictif)
      description: Coché, le projet est présenté comme une maquette d'exemple, pas comme un client. Décochez-le pour un vrai projet client (avec son accord). Dès qu'un vrai projet existe, les maquettes sont masquées tant que « Afficher les contenus d'exemple » est décoché.
      type: boolean
