      description: Facultatif. Sans image, une maquette dessinée aux couleurs ci-dessous est affichée.
      type: image
    - name: mockup
      label: Maquette
      type: select
      options:
        values:
        - plombier
        - electricien
        - macon
        - menuisier
        - couvreur
        - peintre
        - chauffagiste
        - carreleur
        - charpentier
    - name: brand
      label: Nom affiché dans la maquette
      type: string
    - name: domain
      label: Adresse affichée dans la maquette
      type: string
    - name: theme
      label: Couleurs
      description: 'Codes couleur, ex. #0369a1'
      type: object
