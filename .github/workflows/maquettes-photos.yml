# Temporaire : récupère des photos libres (CC0 / domaine public) pour les maquettes.
name: Photos des maquettes
on:
  push:
    branches: [claude/project-thread-m7kpr2]
    paths: [".github/photos/queries.json", ".github/photos/picks.json"]
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Planches ou sélection
        run: |
          if [ -f .github/photos/picks.json ]; then python .github/photos/fetch.py pick; else python .github/photos/fetch.py sheets; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/photos
          [ -d public/images/maquettes ] && git add -A public/images/maquettes
          git commit -m "Photos des maquettes (Wikimedia Commons, licences libres)" || exit 0
          git push
